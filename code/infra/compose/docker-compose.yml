name: puresoc

services:
  puresoc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: puresoc
      POSTGRES_USER: puresoc_admin
      POSTGRES_PASSWORD: puresoc-local-postgres-password
    expose:
      - "5432"
    volumes:
      - puresoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-object-storage:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: puresoc_minio_admin
      MINIO_ROOT_PASSWORD: puresoc-local-minio-password
    expose:
      - "9000"
      - "9001"
    volumes:
      - puresoc-object-storage-data:/data

  puresoc-object-storage-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    environment:
      MINIO_ROOT_USER: puresoc_minio_admin
      MINIO_ROOT_PASSWORD: puresoc-local-minio-password
      PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set puresoc http://puresoc-object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
    depends_on:
      puresoc-object-storage:
        condition: service_started
    restart: "no"

  puresoc-clamav:
    image: clamav/clamav:1.4_base
    platform: linux/amd64
    environment:
      FRESHCLAM_CHECKS: "12"
    expose:
      - "3310"
    volumes:
      - puresoc-clamav-db:/var/lib/clamav

  puresoc-upload-scanner:
    image: puresoc-upload-scanner:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.upload-scanner
    environment:
      PURESOC_UPLOAD_SCANNER_ENGINE: clamav
      PURESOC_CLAMAV_HOST: puresoc-clamav
    expose:
      - "3310"
    depends_on:
      puresoc-clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3310/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  puresoc-migrator:
    image: puresoc-migrator:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: postgresql://puresoc_admin:puresoc-local-postgres-password@puresoc-postgres:5432/puresoc
    depends_on:
      puresoc-postgres:
        condition: service_healthy
    restart: "no"

  puresoc-web:
    image: puresoc-web:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      PURESOC_WEB_API_BASE_URL: "http://puresoc-api:3001"
    ports:
      - "3000:3000"
    depends_on:
      puresoc-api:
        condition: service_started

  puresoc-api:
    image: puresoc-api:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: postgresql://puresoc_admin:puresoc-local-postgres-password@puresoc-postgres:5432/puresoc
      PURESOC_OBJECT_STORAGE_PROVIDER: s3
      PURESOC_OBJECT_STORAGE_ENDPOINT: http://puresoc-object-storage:9000
      PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence
      PURESOC_OBJECT_STORAGE_ACCESS_KEY_ID: puresoc_minio_admin
      PURESOC_OBJECT_STORAGE_SECRET_ACCESS_KEY: puresoc-local-minio-password
      PURESOC_UPLOAD_SCANNER_MODE: http
      PURESOC_UPLOAD_SCANNER_ENDPOINT: http://puresoc-upload-scanner:3310/scan
      PURESOC_REPORT_RENDERER: http://puresoc-report-renderer:3002
    ports:
      - "3001:3001"
    depends_on:
      puresoc-migrator:
        condition: service_completed_successfully
      puresoc-redis:
        condition: service_healthy
      puresoc-object-storage:
        condition: service_started
      puresoc-object-storage-init:
        condition: service_completed_successfully
      puresoc-upload-scanner:
        condition: service_healthy

  puresoc-worker:
    image: puresoc-worker:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-scheduler:
    image: puresoc-scheduler:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scheduler
    environment:
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: postgresql://puresoc_admin:puresoc-local-postgres-password@puresoc-postgres:5432/puresoc
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-connector-runner:
    image: puresoc-connector-runner:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.connector-runner
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-regulatory-importer:
    image: puresoc-regulatory-importer:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.regulatory-importer
    profiles:
      - regulatory

  puresoc-report-renderer:
    image: puresoc-report-renderer:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.report-renderer
    expose:
      - "3002"

volumes:
  puresoc-postgres-data:
  puresoc-object-storage-data:
  puresoc-clamav-db:
