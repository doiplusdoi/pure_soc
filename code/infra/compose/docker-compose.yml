name: puresoc

services:
  puresoc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: puresoc
      POSTGRES_USER: puresoc
      POSTGRES_PASSWORD: puresoc
    ports:
      - "5432:5432"
    volumes:
      - puresoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puresoc -d puresoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-object-storage:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: puresoc
      MINIO_ROOT_PASSWORD: puresoc-local-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - puresoc-object-storage-data:/data

  puresoc-web:
    image: puresoc-web:local
    pull_policy: never
    env_file:
      - ../../.env.example
    environment:
      PORT: "3000"
      PURESOC_WEB_API_BASE_URL: "http://puresoc-api:3001"
    ports:
      - "3000:3000"
    depends_on:
      puresoc-api:
        condition: service_started

  puresoc-api:
    image: puresoc-api:local
    pull_policy: never
    env_file:
      - ../../.env.example
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      puresoc-postgres:
        condition: service_healthy
      puresoc-redis:
        condition: service_healthy
      puresoc-object-storage:
        condition: service_started

  puresoc-worker:
    image: puresoc-worker:local
    pull_policy: never
    env_file:
      - ../../.env.example
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-scheduler:
    image: puresoc-scheduler:local
    pull_policy: never
    env_file:
      - ../../.env.example
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-connector-runner:
    image: puresoc-connector-runner:local
    pull_policy: never
    env_file:
      - ../../.env.example
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-regulatory-importer:
    image: puresoc-regulatory-importer:local
    pull_policy: never
    env_file:
      - ../../.env.example
    profiles:
      - regulatory

  puresoc-report-renderer:
    image: puresoc-report-renderer:local
    pull_policy: never
    env_file:
      - ../../.env.example
    environment:
      PORT: "3002"
    ports:
      - "3002:3002"

volumes:
  puresoc-postgres-data:
  puresoc-object-storage-data:
