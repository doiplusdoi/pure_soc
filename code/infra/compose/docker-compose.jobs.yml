name: puresoc-jobs

services:
  puresoc-worker:
    image: puresoc-worker:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
  puresoc-scheduler:
    image: puresoc-scheduler:local
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scheduler
