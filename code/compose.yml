name: puresoc

x-puresoc-database-url: &puresoc-database-url postgresql://puresoc_app:5da87b6fbfb87b8c13b2c47498f611baf59c469075f2515db0e1bddb5e9c5d6f@puresoc-postgres:5432/puresoc_live

x-puresoc-backend-base-environment: &puresoc-backend-base-environment
  PURESOC_APP_ENV: production
  PURESOC_PUBLIC_BASE_URL: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin, for example https://app.example.com}
  PURESOC_API_BASE_URL: http://puresoc-api:3001
  PURESOC_API_TRUSTED_ORIGINS: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin}
  PURESOC_AUTH_COOKIE_SECURE: "true"
  PURESOC_AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
  PURESOC_API_ORIGIN_PROTECTION_ENABLED: "true"
  PURESOC_API_REQUIRE_ORIGIN_OR_REFERER: "true"
  PURESOC_REDIS_URL: redis://puresoc-redis:6379/0
  PURESOC_JOB_QUEUE_PROVIDER: bullmq
  PURESOC_API_RATE_LIMIT_STORE_PROVIDER: redis
  PURESOC_UPLOAD_SCANNER_MODE: http
  PURESOC_UPLOAD_SCANNER_ENDPOINT: http://puresoc-upload-scanner:3310/scan

x-puresoc-object-storage-environment: &puresoc-object-storage-environment
  PURESOC_OBJECT_STORAGE_PROVIDER: s3
  PURESOC_OBJECT_STORAGE_ENDPOINT: http://puresoc-object-storage:9000
  PURESOC_OBJECT_STORAGE_REGION: eu-central-1
  PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence-live
  PURESOC_OBJECT_STORAGE_ACCESS_KEY_ID: puresoc_minio_e1fe7284
  PURESOC_OBJECT_STORAGE_SECRET_ACCESS_KEY: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
  PURESOC_OBJECT_STORAGE_FORCE_PATH_STYLE: "true"

x-puresoc-microsoft365-connector-environment: &puresoc-microsoft365-connector-environment
  PURESOC_CONNECTOR_MICROSOFT365_MODE: live
  PURESOC_CONNECTOR_MICROSOFT365_CLIENT_ID: ${PURESOC_CONNECTOR_MICROSOFT365_CLIENT_ID:?Set the PureSOC Microsoft 365 connector app client ID}
  PURESOC_CONNECTOR_MICROSOFT365_CLIENT_SECRET: ${PURESOC_CONNECTOR_MICROSOFT365_CLIENT_SECRET:?Set the PureSOC Microsoft 365 connector app client secret}
  PURESOC_CONNECTOR_MICROSOFT365_AUTHORITY_HOST: https://login.microsoftonline.com
  PURESOC_CONNECTOR_MICROSOFT365_REDIRECT_URI: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin}/providers/microsoft365/callback
  PURESOC_CONNECTOR_MICROSOFT365_GRAPH_BASE_URL: https://graph.microsoft.com/v1.0
  PURESOC_CONNECTOR_MICROSOFT365_WRITE_SCOPES_ALLOWED: "false"
  PURESOC_PROVIDER_TOKEN_KEY_ID: live-current
  PURESOC_PROVIDER_TOKEN_KEY: ${PURESOC_PROVIDER_TOKEN_KEY:?Set a long random key used to encrypt stored Microsoft OAuth tokens}

x-puresoc-social-login-environment: &puresoc-social-login-environment
  PURESOC_AUTH_MICROSOFT_ENTRA_ENABLED: "false"
  PURESOC_AUTH_GOOGLE_ENABLED: "false"
  PURESOC_AUTH_GITHUB_ENABLED: "false"

x-puresoc-billing-environment: &puresoc-billing-environment
  PURESOC_BILLING_PROVIDER: none

services:
  puresoc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: puresoc_live
      POSTGRES_USER: puresoc_app
      POSTGRES_PASSWORD: 5da87b6fbfb87b8c13b2c47498f611baf59c469075f2515db0e1bddb5e9c5d6f
    expose:
      - "5432"
    volumes:
      - puresoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-object-storage:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: puresoc_minio_e1fe7284
      MINIO_ROOT_PASSWORD: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
    expose:
      - "9000"
      - "9001"
    volumes:
      - puresoc-object-storage-data:/data

  puresoc-object-storage-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    environment:
      MINIO_ROOT_USER: puresoc_minio_e1fe7284
      MINIO_ROOT_PASSWORD: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
      PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence-live
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set puresoc http://puresoc-object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
    depends_on:
      puresoc-object-storage:
        condition: service_started
    restart: "no"

  puresoc-clamav:
    image: clamav/clamav:1.4_base
    platform: linux/amd64
    environment:
      FRESHCLAM_CHECKS: "12"
    expose:
      - "3310"
    volumes:
      - puresoc-clamav-db:/var/lib/clamav

  puresoc-upload-scanner:
    image: puresoc-upload-scanner:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.upload-scanner
    environment:
      PURESOC_UPLOAD_SCANNER_ENGINE: clamav
      PURESOC_CLAMAV_HOST: puresoc-clamav
    expose:
      - "3310"
    depends_on:
      puresoc-clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3310/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  puresoc-migrator:
    image: puresoc-migrator:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
    depends_on:
      puresoc-postgres:
        condition: service_healthy
    restart: "no"

  puresoc-web:
    image: puresoc-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      PURESOC_APP_ENV: production
      PURESOC_PUBLIC_BASE_URL: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin}
      PURESOC_WEB_PUBLIC_BASE_URL: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin}
      PURESOC_WEB_API_BASE_URL: "http://puresoc-api:3001"
      PURESOC_AUTH_MICROSOFT_ENTRA_ENABLED: "false"
      PURESOC_CONNECTOR_MICROSOFT365_REDIRECT_URI: ${PURESOC_PUBLIC_BASE_URL:?Set PURESOC_PUBLIC_BASE_URL to the public HTTPS origin}/providers/microsoft365/callback
    ports:
      - "3000:3000"
    depends_on:
      puresoc-api:
        condition: service_started

  puresoc-api:
    image: puresoc-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<:
        - *puresoc-backend-base-environment
        - *puresoc-object-storage-environment
        - *puresoc-microsoft365-connector-environment
        - *puresoc-social-login-environment
        - *puresoc-billing-environment
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
      PURESOC_REPORT_RENDERER: http://puresoc-report-renderer:3002
    expose:
      - "3001"
    depends_on:
      puresoc-migrator:
        condition: service_completed_successfully
      puresoc-redis:
        condition: service_healthy
      puresoc-object-storage:
        condition: service_started
      puresoc-object-storage-init:
        condition: service_completed_successfully
      puresoc-upload-scanner:
        condition: service_healthy

  puresoc-worker:
    image: puresoc-worker:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *puresoc-backend-base-environment
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-scheduler:
    image: puresoc-scheduler:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.scheduler
    environment:
      <<: *puresoc-backend-base-environment
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-connector-runner:
    image: puresoc-connector-runner:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.connector-runner
    environment:
      <<:
        - *puresoc-backend-base-environment
        - *puresoc-microsoft365-connector-environment
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-regulatory-importer:
    image: puresoc-regulatory-importer:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.regulatory-importer
    profiles:
      - regulatory

  puresoc-report-renderer:
    image: puresoc-report-renderer:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.report-renderer
    expose:
      - "3002"

volumes:
  puresoc-postgres-data:
  puresoc-object-storage-data:
  puresoc-clamav-db:
