name: puresoc

x-puresoc-database-url: &puresoc-database-url postgresql://puresoc_admin:puresoc-local-postgres-password@puresoc-postgres:5432/puresoc

x-puresoc-backend-base-environment: &puresoc-backend-base-environment
  PURESOC_APP_ENV: ${PURESOC_APP_ENV:-development}
  PURESOC_API_BASE_URL: http://puresoc-api:3001
  PURESOC_API_TRUSTED_ORIGINS: http://puresoc-web:3000
  PURESOC_AUTH_COOKIE_SECURE: ${PURESOC_AUTH_COOKIE_SECURE:-false}
  PURESOC_AUTH_REQUIRE_EMAIL_VERIFICATION: ${PURESOC_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
  PURESOC_API_ORIGIN_PROTECTION_ENABLED: "true"
  PURESOC_API_REQUIRE_ORIGIN_OR_REFERER: "true"
  PURESOC_REDIS_URL: redis://puresoc-redis:6379/0
  PURESOC_JOB_QUEUE_PROVIDER: bullmq
  PURESOC_CONNECTOR_RUNNER_ALLOW_PROVIDER_WRITES: ${PURESOC_CONNECTOR_RUNNER_ALLOW_PROVIDER_WRITES:-false}
  PURESOC_API_RATE_LIMIT_STORE_PROVIDER: redis
  PURESOC_UPLOAD_SCANNER_MODE: http
  PURESOC_UPLOAD_SCANNER_ENDPOINT: http://puresoc-upload-scanner:3310/scan

x-puresoc-object-storage-environment: &puresoc-object-storage-environment
  PURESOC_OBJECT_STORAGE_PROVIDER: s3
  PURESOC_OBJECT_STORAGE_ENDPOINT: http://puresoc-object-storage:9000
  PURESOC_OBJECT_STORAGE_REGION: eu-central-1
  PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence-live
  PURESOC_OBJECT_STORAGE_ACCESS_KEY_ID: puresoc_minio_e1fe7284
  PURESOC_OBJECT_STORAGE_SECRET_ACCESS_KEY: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
  PURESOC_OBJECT_STORAGE_FORCE_PATH_STYLE: "true"

x-puresoc-microsoft365-connector-environment: &puresoc-microsoft365-connector-environment
  PURESOC_CONNECTOR_MICROSOFT365_MODE: ${PURESOC_CONNECTOR_MICROSOFT365_MODE:-auto}
  PURESOC_CONNECTOR_MICROSOFT365_CLIENT_ID: ${PURESOC_CONNECTOR_MICROSOFT365_CLIENT_ID:-}
  PURESOC_CONNECTOR_MICROSOFT365_CLIENT_SECRET: ${PURESOC_CONNECTOR_MICROSOFT365_CLIENT_SECRET:-}
  PURESOC_CONNECTOR_MICROSOFT365_AUTHORITY_HOST: https://login.microsoftonline.com
  PURESOC_CONNECTOR_MICROSOFT365_GRAPH_BASE_URL: https://graph.microsoft.com/v1.0
  PURESOC_CONNECTOR_MICROSOFT365_WRITE_SCOPES_ALLOWED: "false"
  PURESOC_PROVIDER_TOKEN_KEY: ${PURESOC_PROVIDER_TOKEN_KEY:-}

x-puresoc-social-login-environment: &puresoc-social-login-environment
  PURESOC_AUTH_MICROSOFT_ENTRA_ENABLED: "false"
  PURESOC_AUTH_GOOGLE_ENABLED: "false"
  PURESOC_AUTH_GITHUB_ENABLED: "false"

x-puresoc-billing-environment: &puresoc-billing-environment
  PURESOC_BILLING_PROVIDER: none

services:
  puresoc-postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: puresoc
      POSTGRES_USER: puresoc_admin
      POSTGRES_PASSWORD: puresoc-local-postgres-password
    expose:
      - "5432"
    volumes:
      - puresoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-postgres-bootstrap:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        ensure_canonical_database() {
          if [ "$2" != "puresoc_admin" ]; then
            PGPASSWORD="$1" psql -v ON_ERROR_STOP=1 -h puresoc-postgres -U "$2" -d postgres <<'SQL'
        DO 'BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''puresoc_admin'') THEN
            CREATE ROLE puresoc_admin LOGIN PASSWORD ''puresoc-local-postgres-password'';
          ELSE
            ALTER ROLE puresoc_admin WITH LOGIN PASSWORD ''puresoc-local-postgres-password'';
          END IF;
        END';
        SQL
          fi

          PGPASSWORD="$1" psql -v ON_ERROR_STOP=1 -h puresoc-postgres -U "$2" -d postgres <<'SQL'
        SELECT 'CREATE DATABASE puresoc OWNER puresoc_admin'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'puresoc')\gexec
        ALTER DATABASE puresoc OWNER TO puresoc_admin;
        GRANT ALL PRIVILEGES ON DATABASE puresoc TO puresoc_admin;
        SQL

          PGPASSWORD="$1" psql -v ON_ERROR_STOP=1 -h puresoc-postgres -U "$2" -d puresoc <<'SQL'
        ALTER SCHEMA public OWNER TO puresoc_admin;
        GRANT ALL ON SCHEMA public TO puresoc_admin;

        DO 'DECLARE
          item record;
        BEGIN
          FOR item IN
            SELECT
              CASE c.relkind
                WHEN ''S'' THEN ''SEQUENCE''
                WHEN ''v'' THEN ''VIEW''
                WHEN ''m'' THEN ''MATERIALIZED VIEW''
                WHEN ''f'' THEN ''FOREIGN TABLE''
                ELSE ''TABLE''
              END AS object_kind,
              n.nspname,
              c.relname
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = ''public''
              AND c.relkind IN (''f'', ''m'', ''p'', ''r'', ''S'', ''v'')
          LOOP
            EXECUTE format(''ALTER %s %I.%I OWNER TO puresoc_admin'', item.object_kind, item.nspname, item.relname);
          END LOOP;

          FOR item IN
            SELECT n.nspname, t.typname
            FROM pg_type t
            JOIN pg_namespace n ON n.oid = t.typnamespace
            WHERE n.nspname = ''public''
              AND t.typtype = ''e''
          LOOP
            EXECUTE format(''ALTER TYPE %I.%I OWNER TO puresoc_admin'', item.nspname, item.typname);
          END LOOP;
        END';

        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO puresoc_admin;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO puresoc_admin;
        GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO puresoc_admin;
        SQL
        }

        if PGPASSWORD='puresoc' psql -h puresoc-postgres -U puresoc -d postgres -tAc 'select 1' >/dev/null 2>&1; then
          ensure_canonical_database 'puresoc' puresoc
          exit 0
        fi

        if PGPASSWORD='5da87b6fbfb87b8c13b2c47498f611baf59c469075f2515db0e1bddb5e9c5d6f' psql -h puresoc-postgres -U puresoc_app -d postgres -tAc 'select 1' >/dev/null 2>&1; then
          ensure_canonical_database '5da87b6fbfb87b8c13b2c47498f611baf59c469075f2515db0e1bddb5e9c5d6f' puresoc_app
          exit 0
        fi

        if PGPASSWORD='puresoc-local-postgres-password' psql -h puresoc-postgres -U puresoc_admin -d postgres -tAc 'select 1' >/dev/null 2>&1; then
          ensure_canonical_database 'puresoc-local-postgres-password' puresoc_admin
          exit 0
        fi

        echo "Could not authenticate to bundled Postgres with a known PureSOC Compose credential set." >&2
        exit 1
    depends_on:
      puresoc-postgres:
        condition: service_healthy
    restart: "no"

  puresoc-redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  puresoc-object-storage:
    image: quay.io/minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: puresoc_minio_e1fe7284
      MINIO_ROOT_PASSWORD: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
    expose:
      - "9000"
      - "9001"
    volumes:
      - puresoc-object-storage-data:/data

  puresoc-object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-01-17T23-25-50Z
    environment:
      MINIO_ROOT_USER: puresoc_minio_e1fe7284
      MINIO_ROOT_PASSWORD: 0616c13d283497b115518203da3a334c1afd7eeed77e653e3d78c955db64ba10
      PURESOC_OBJECT_STORAGE_BUCKET: puresoc-evidence-live
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set puresoc http://puresoc-object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "puresoc/$${PURESOC_OBJECT_STORAGE_BUCKET}"
    depends_on:
      puresoc-object-storage:
        condition: service_started
    restart: "no"

  puresoc-clamav:
    image: ${PURESOC_CLAMAV_IMAGE:-clamav/clamav:1.4_base}
    platform: linux/amd64
    environment:
      FRESHCLAM_CHECKS: "12"
    expose:
      - "3310"
    volumes:
      - puresoc-clamav-db:/var/lib/clamav

  puresoc-upload-scanner:
    image: puresoc-upload-scanner:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.upload-scanner
    environment:
      PURESOC_UPLOAD_SCANNER_ENGINE: clamav
      PURESOC_CLAMAV_HOST: puresoc-clamav
    expose:
      - "3310"
    depends_on:
      puresoc-clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3310/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  puresoc-migrator:
    image: puresoc-migrator:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
    depends_on:
      puresoc-postgres-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  puresoc-web:
    image: puresoc-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      PURESOC_APP_ENV: ${PURESOC_APP_ENV:-development}
      PURESOC_WEB_API_BASE_URL: "http://puresoc-api:3001"
      PURESOC_WEB_API_REQUEST_ORIGIN: "http://puresoc-web:3000"
      PURESOC_AUTH_MICROSOFT_ENTRA_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      puresoc-api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  puresoc-api:
    image: puresoc-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["sh", "-c", "pnpm prisma:migrate:deploy && exec pnpm start:api"]
    environment:
      <<:
        - *puresoc-backend-base-environment
        - *puresoc-object-storage-environment
        - *puresoc-microsoft365-connector-environment
        - *puresoc-social-login-environment
        - *puresoc-billing-environment
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
      PURESOC_REPORT_RENDERER: http://puresoc-report-renderer:3002
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      puresoc-migrator:
        condition: service_completed_successfully
      puresoc-redis:
        condition: service_healthy
      puresoc-object-storage:
        condition: service_started
      puresoc-object-storage-init:
        condition: service_completed_successfully
      puresoc-upload-scanner:
        condition: service_healthy

  puresoc-worker:
    image: puresoc-worker:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *puresoc-backend-base-environment
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-scheduler:
    image: puresoc-scheduler:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.scheduler
    environment:
      <<: *puresoc-backend-base-environment
      PURESOC_PERSISTENCE_MODE: prisma
      DATABASE_URL: *puresoc-database-url
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-connector-runner:
    image: puresoc-connector-runner:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.connector-runner
    environment:
      <<:
        - *puresoc-backend-base-environment
        - *puresoc-microsoft365-connector-environment
    depends_on:
      puresoc-api:
        condition: service_started
      puresoc-redis:
        condition: service_healthy

  puresoc-regulatory-importer:
    image: puresoc-regulatory-importer:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.regulatory-importer
    profiles:
      - regulatory

  puresoc-report-renderer:
    image: puresoc-report-renderer:local
    pull_policy: build
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.report-renderer
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  puresoc-postgres-data:
  puresoc-object-storage-data:
  puresoc-clamav-db:
